<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mega Mart Shop</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header><a th:href="@{/shop}"><h1>Mega Mart</h1></a></header>
<main>
  <div class="row">
    <div><h2>Shop</h2><p class="hint">Choose products and add them to your order.</p></div>
    <a class="button" th:href="@{/shop/checkout}">Checkout (<span th:text="${cartCount}">0</span>)</a>
  </div>

  <p class="notice" th:if="${orderPlaced}" th:text="${orderPlaced}"></p>
  <p class="notice" th:if="${shopMessage}" th:text="${shopMessage}"></p>
  <p class="error" th:if="${shopError}" th:text="${shopError}"></p>

  <div class="layout">
    <section>
      <div class="grid" th:if="${!products.empty}">
        <article class="product" th:each="product : ${products.content}">
          <h3 th:text="${product.name}">Product name</h3>
          <p class="meta">
            <span th:text="${product.category}">Category</span>
            <span th:if="${product.weight != null}" th:text="${' · ' + product.weight}"> · weight</span>
          </p>
          <p class="price">₹<span th:text="${product.price}">0.00</span></p>
          <p class="meta" th:text="${product.inStock ? 'In stock: ' + product.stockQuantity : 'Out of stock'}">Stock</p>
          <form th:action="@{/shop/cart/add}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="productId" th:value="${product.id}">
            <label th:for="|quantity-${product.id}|">Quantity</label>
            <input type="number" name="quantity" min="1" max="99" value="1"
                   th:id="|quantity-${product.id}|" th:disabled="${!product.inStock}">
            <div class="actions"><button type="submit" th:disabled="${!product.inStock}">Add to order</button></div>
          </form>
        </article>
      </div>
      <p class="empty" th:if="${products.empty}">No products are available right now.</p>
      <nav class="toolbar" aria-label="Product pages" th:if="${products.totalPages > 1}">
        <a class="button secondary" th:if="${products.hasPrevious()}" th:href="@{/shop(page=${products.number - 1})}">Previous</a>
        <span class="meta">Page <span th:text="${products.number + 1}">1</span> of <span th:text="${products.totalPages}">1</span></span>
        <a class="button secondary" th:if="${products.hasNext()}" th:href="@{/shop(page=${products.number + 1})}">Next</a>
      </nav>
    </section>

    <aside class="panel">
      <h2>Your order</h2>
      <p class="meta" th:if="${cartLines.empty}">Your cart is empty.</p>
      <div class="row" th:each="line : ${cartLines}">
        <span><span th:text="${line.product.name}">Product</span> × <span th:text="${line.quantity}">1</span></span>
        <form th:action="@{/shop/cart/remove}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="productId" th:value="${line.product.id}">
          <button type="submit" class="secondary">Remove</button>
        </form>
      </div>
      <p class="price" th:if="${!cartLines.empty}">Total: ₹<span th:text="${cartTotal}">0.00</span></p>
      <a class="button" th:if="${!cartLines.empty}" th:href="@{/shop/checkout}">Continue to checkout</a>
    </aside>
  </div>

  <footer class="footer"><a th:href="@{/seller/login}">Seller sign in</a></footer>
</main>
</body>
</html>

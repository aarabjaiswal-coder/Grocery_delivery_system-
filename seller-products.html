<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage products · Mega Mart</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header>
  <div class="row">
    <a th:href="@{/seller/orders}"><h1>Mega Mart · Seller</h1></a>
    <form th:action="@{/seller/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="secondary">Sign out</button>
    </form>
  </div>
</header>
<main>
  <div class="row">
    <div><h2>Products</h2><p class="hint">Add products and update prices or stock.</p></div>
    <a class="button" th:href="@{/seller/products/new}">Add product</a>
  </div>
  <p class="success" th:if="${sellerMessage}" th:text="${sellerMessage}"></p>
  <p class="error" th:if="${sellerError}" th:text="${sellerError}"></p>
  <p class="empty" th:if="${products.empty}">No products have been added yet.</p>
  <div class="table-wrap" th:if="${!products.empty}">
    <table>
      <thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>Stock</th><th></th></tr></thead>
      <tbody>
      <tr th:each="product : ${products.content}">
        <td><span th:text="${product.name}">Product</span><br><span class="meta" th:text="${product.category}">Category</span></td>
        <td th:text="${product.sku}">SKU</td>
        <td>₹<span th:text="${product.price}">0.00</span></td>
        <td th:text="${product.stockQuantity}">0</td>
        <td><a th:href="@{/seller/products/{id}/edit(id=${product.id})}">Edit</a></td>
      </tr>
      </tbody>
    </table>
  </div>
  <nav class="toolbar" aria-label="Product pages" th:if="${products.totalPages > 1}">
    <a class="button secondary" th:if="${products.hasPrevious()}" th:href="@{/seller/products(page=${products.number - 1})}">Previous</a>
    <span class="meta">Page <span th:text="${products.number + 1}">1</span> of <span th:text="${products.totalPages}">1</span></span>
    <a class="button secondary" th:if="${products.hasNext()}" th:href="@{/seller/products(page=${products.number + 1})}">Next</a>
  </nav>
  <p class="toolbar"><a th:href="@{/seller/orders}">← Back to orders</a></p>
</main>
</body>
</html>

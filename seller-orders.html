<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="15;url=/seller/orders">
  <title>Seller orders · Mega Mart</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header>
  <div class="row">
    <a th:href="@{/seller/orders}"><h1>Mega Mart · Seller</h1></a>
    <form th:action="@{/seller/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="secondary">Sign out</button>
    </form>
  </div>
</header>
<main>
  <div class="row">
    <div><h2>Orders</h2><p class="hint">This page refreshes every 15 seconds while open.</p></div>
    <a class="button secondary" th:href="@{/seller/products}">Manage products</a>
  </div>
  <p class="success" th:if="${sellerMessage}" th:text="${sellerMessage}"></p>
  <p class="error" th:if="${sellerError}" th:text="${sellerError}"></p>

  <section class="notice" th:if="${!newOrders.empty}" role="status">
    <strong>New order received</strong>
    <div th:each="order : ${newOrders}">
      <span th:text="|#${order.orderId}: ${order.recipientName}, ${order.customerPhone}, ${order.deliveryAddress}|"></span>
    </div>
  </section>

  <p class="empty" th:if="${orders.empty}">No orders have been placed yet.</p>
  <article class="order-card" th:each="order : ${orders.content}">
    <div class="row">
      <h2 th:text="|Order #${order.orderId}|">Order</h2>
      <strong th:text="${order.orderStatus}">PLACED</strong>
    </div>
    <p class="price">₹<span th:text="${order.totalAmount}">0.00</span> · COD · <span th:text="${order.paymentStatus}">UNPAID</span></p>
    <p><strong>Recipient:</strong> <span th:text="${order.recipientName}">Name</span></p>
    <p><strong>Phone:</strong> <a th:href="|tel:${order.customerPhone}|"><span th:text="${order.customerPhone}">Phone</span></a></p>
    <p><strong>Delivery address:</strong> <span th:text="${order.deliveryAddress}">Address</span></p>
    <p class="meta">Placed <span th:text="${order.createdAt}">time</span></p>
    <ul>
      <li th:each="item : ${order.items}" th:text="|${item.quantity} × ${item.productName} (₹${item.unitPrice})|">Item</li>
    </ul>
    <div class="actions">
      <form th:if="${order.orderStatus.name() == 'PLACED'}"
            th:action="@{/seller/orders/{id}/status(id=${order.orderId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" name="status" value="PROCESSING">Start processing</button>
      </form>
      <form th:if="${order.orderStatus.name() == 'PROCESSING'}"
            th:action="@{/seller/orders/{id}/status(id=${order.orderId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" name="status" value="OUT_FOR_DELIVERY">Mark out for delivery</button>
      </form>
      <form th:if="${order.orderStatus.name() == 'OUT_FOR_DELIVERY'}"
            th:action="@{/seller/orders/{id}/status(id=${order.orderId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" name="status" value="DELIVERED">Mark delivered</button>
      </form>
      <form th:if="${order.orderStatus.name() == 'PLACED' or order.orderStatus.name() == 'PROCESSING'}"
            th:action="@{/seller/orders/{id}/status(id=${order.orderId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" name="status" value="CANCELLED" class="danger">Cancel order</button>
      </form>
      <form th:if="${order.orderStatus.name() == 'DELIVERED' and order.paymentStatus.name() == 'UNPAID'}"
            th:action="@{/seller/orders/{id}/cash-collected(id=${order.orderId})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="secondary">Record cash collected</button>
      </form>
    </div>
  </article>

  <nav class="toolbar" aria-label="Order pages" th:if="${orders.totalPages > 1}">
    <a class="button secondary" th:if="${orders.hasPrevious()}" th:href="@{/seller/orders(page=${orders.number - 1})}">Previous</a>
    <span class="meta">Page <span th:text="${orders.number + 1}">1</span> of <span th:text="${orders.totalPages}">1</span></span>
    <a class="button secondary" th:if="${orders.hasNext()}" th:href="@{/seller/orders(page=${orders.number + 1})}">Next</a>
  </nav>
</main>
</body>
</html>

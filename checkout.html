<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Mega Mart</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<header><a th:href="@{/shop}"><h1>Mega Mart</h1></a></header>
<main>
  <a th:href="@{/shop}">← Back to shop</a>
  <div class="layout">
    <section class="panel">
      <h2>Delivery details</h2>
      <p class="hint">Enter the recipient's name, phone number, and written delivery address.</p>
      <p class="error" th:if="${checkoutError}" th:text="${checkoutError}"></p>
      <form th:action="@{/shop/orders}" th:object="${form}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="recipientName">Recipient name</label>
        <input id="recipientName" type="text" th:field="*{recipientName}" maxlength="120" autocomplete="name" required>
        <span class="field-error" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"></span>

        <label for="phone">Phone number</label>
        <input id="phone" type="tel" th:field="*{phone}" maxlength="24" autocomplete="tel" inputmode="tel" required>
        <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

        <label for="deliveryAddress">Delivery address</label>
        <textarea id="deliveryAddress" th:field="*{deliveryAddress}" maxlength="1000"
                  placeholder="House or flat, street, area, city, PIN code, and landmark" required></textarea>
        <span class="field-error" th:if="${#fields.hasErrors('deliveryAddress')}" th:errors="*{deliveryAddress}"></span>

        <div class="notice">Payment is Cash on Delivery. The seller will see the name, phone number, and delivery address entered here.</div>
        <button type="submit">Place order</button>
      </form>
    </section>
    <aside class="panel">
      <h2>Order summary</h2>
      <div class="row" th:each="line : ${cartLines}">
        <span><span th:text="${line.product.name}">Product</span> × <span th:text="${line.quantity}">1</span></span>
        <span>₹<span th:text="${line.lineTotal}">0.00</span></span>
      </div>
      <p class="price">Total: ₹<span th:text="${cartTotal}">0.00</span></p>
    </aside>
  </div>
</main>
</body>
</html>
